[project]
name = "word-search-generator"
version = "1.0.0"
description = "Deterministic word search puzzle generator"
requires-python = ">=3.12"
dependencies = [
    "reportlab>=5.1.0",
]

[project.scripts]
word-search = "word_search_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
